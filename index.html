<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Moje recepty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles.css">
  <meta name="theme-color" content="#d35400">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <!-- header intentionally minimal; title moved into hero -->
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-inner">
        <div class="hero-text">
          <h2>Moje oblíbené recepty</h2>
        </div>
        <div class="hero-search">
          <input id="search" placeholder="Hledat recepty..." aria-label="Hledat recepty" />
        </div>
      </div>
    </section>

    <div class="container">
      <section id="list" class="panel cards"></section>

      <section id="detail" class="panel hidden detail-panel detail-card" aria-hidden="true">
        <div style="width:100%;display:flex;justify-content:center;margin-bottom:0.5rem;">
          <button id="back" class="btn ghost" aria-label="Zpět">◀ Zpět</button>
        </div>

        <div id="detail-image" class="detail-image" role="img" aria-label="Obrázek receptu"></div>

        <h2 id="detail-title" class="detail-title"></h2>
        <p id="detail-desc" class="detail-desc"></p>

        <h3>Ingredience</h3>
        <ul id="detail-ingredients"></ul>

        <h3>Postup</h3>
        <ol id="detail-steps"></ol>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"></div>
  </footer>

  <script src="src/app.js"></script>
</body>
</html>
