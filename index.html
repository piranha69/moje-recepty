<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Moje recepty</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <header>
    <h1>Moje recepty</h1>
    <div class="controls">
      <input id="search" placeholder="Hledat recepty..." />
      <button id="btn-new">Přidat recept</button>
    </div>
  </header>

  <main>
    <section id="list" class="panel"></section>

    <section id="detail" class="panel hidden">
      <button id="back">◀ Zpět</button>
      <h2 id="detail-title"></h2>
      <p id="detail-desc"></p>
      <h3>Ingredience</h3>
      <ul id="detail-ingredients"></ul>
      <h3>Postup</h3>
      <ol id="detail-steps"></ol>
      <div class="detail-actions">
        <button id="edit">Upravit</button>
        <button id="delete">Smazat</button>
      </div>
    </section>

    <section id="form" class="panel hidden">
      <h2 id="form-title">Přidat recept</h2>
      <form id="recipe-form">
        <input type="hidden" id="recipe-id" />
        <label>Název<br><input id="title" required /></label>
        <label>Krátký popis<br><input id="description" /></label>
        <label>Ingredience (jedna na řádek)<br><textarea id="ingredients"></textarea></label>
        <label>Postup (jedna věta/řádek)<br><textarea id="steps"></textarea></label>
        <label>Štítky (oddělit čárkou)<br><input id="tags" /></label>
        <div class="form-actions">
          <button type="submit">Uložit</button>
          <button type="button" id="cancel">Zrušit</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <small>Statická aplikace — data se ukládají v prohlížeči (localStorage). Více v README.</small>
  </footer>

  <script src="src/app.js"></script>
</body>
</html>
