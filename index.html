<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Moje recepty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles.css">
  <meta name="theme-color" content="#d35400">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">
        <h1>Moje recepty</h1>
        <p class="tagline">Sbírka vašich oblíbených jídel</p>
      </div>
      <div class="controls">
        <input id="search" placeholder="Hledat recepty..." aria-label="Hledat recepty" />
      </div>
    </div>
  </header>

  <main class="container">
    <section id="list" class="panel cards"></section>

    <section id="detail" class="panel hidden detail-panel">
      <button id="back" class="btn ghost">◀ Zpět</button>
      <h2 id="detail-title"></h2>
      <p id="detail-desc"></p>
      <h3>Ingredience</h3>
      <ul id="detail-ingredients"></ul>
      <h3>Postup</h3>
      <ol id="detail-steps"></ol>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <!-- Footer intentionally left blank -->
    </div>
  </footer>

  <script src="src/app.js"></script>
</body>
</html>
